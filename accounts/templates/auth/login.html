
{% extends "layouts.html" %}
{% block content %}

<div
  class="min-h-[calc(100vh-5rem)] flex items-center justify-center bg-[var(--color-bg-main)]"
  x-data="{ showPassword: false }"
>
  <div
    class="w-full max-w-md rounded-xl shadow-xl p-8"
    style="background-color: var(--color-bg-form);"
  >
    <!-- Title -->
    <h2
      class="text-center text-2xl font-semibold mb-6"
      style="color: var(--color-text-header);"
    >
      Login
    </h2>


    <!-- Login Form -->
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <!-- Username -->
      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary);">
          Username
        </label>
        <!-- {{ form.username }} ini bawaa Django -->
     <input
            name="username"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary); ">
          Password
        </label>

        <div class="relative">
          <input
            :type="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />

          <!-- Toggle Password -->
          <button
            type="button"
            @click="showPassword = !showPassword"
            class="absolute right-2 top-2 text-sm"
            style="color: var(--color-text-muted);"
          >
            👁
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-2 rounded-md font-semibold text-white transition"
        style="
          background-color: var(--color-button-login);
        "
        onmouseover="this.style.backgroundColor='var(--color-button-login-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-button-login)'"
      >
        Login
      </button>
    </form>

    {% if form.non_field_errors %}
    <div class="text-sm ">
     Infor  : {{ form.non_field_errors }}
    </div>
    {% endif %}

    <footer class="mt-6 text-center text-sm"
         style="color: var(--color-text-muted);">
      Belum punya akun?
      <a
        href="{% url 'accounts:accounts_register' %}"
        class="font-medium"
        style="color: var(--color-primary);"
      >
        Register
      </a>
    </footer>
  </div>
</div>

{% endblock %}
