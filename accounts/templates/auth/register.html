
{% extends "layouts.html" %}
{% block content %}

<div
  class="min-h-[calc(100vh-5rem)] flex items-center justify-center bg-[var(--color-bg-main)]"
  x-data="{ showPassword1: false, showPassword2: false }"
>
  <div
    class="w-full max-w-md rounded-xl shadow-xl p-8"
    style="background-color: var(--color-bg-form);"
  >
    <h2
      class="text-center text-2xl font-semibold mb-6"
      style="color: var(--color-text-header);"
    >
      Register
    </h2>


    <!-- Register Form -->
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary);">
          Username
        </label>
        {{ form.username }}
      </div>

      {% if form.email %}
      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary);">
          Email
        </label>
        {{ form.email }}
      </div>
      {% endif %}

      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary);">
          Password
        </label>

        <div class="relative">
          <input
            :type="showPassword1 ? 'text' : 'password'"
            name="{{ form.password1.name }}"
            autocomplete="new-password"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />

          <button
            type="button"
            @click="showPassword1 = !showPassword1"
            class="absolute right-2 top-2 text-sm"
            style="color: var(--color-text-muted);"
          >
            👁
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm mb-1"
          style="color: var(--color-text-secondary);">
          Konfirmasi Password
        </label>

        <div class="relative">
          <input
            :type="showPassword2 ? 'text' : 'password'"
            name="{{ form.password2.name }}"
            autocomplete="new-password"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />

          <button
            type="button"
            @click="showPassword2 = !showPassword2"
            class="absolute right-2 top-2 text-sm"
            style="color: var(--color-text-muted);"
          >
            👁
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-2 rounded-md font-semibold text-white transition bg-[ var(--color-button-login)]"
        onmouseover="this.style.backgroundColor='var(--color-button-login-hover)'"
        onmouseout="this.style.backgroundColor='var(--color-button-login)'"
      >
        Register
      </button>
    </form>

   <div class="text-sm ">
     Infor  : {{ form.non_field_errors }}
 
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-sm"
         style="color: var(--color-text-muted);">
      Sudah punya akun?
      <a
        href="{% url 'accounts:accounts_login' %}"
        class="font-medium"
        style="color: var(--color-primary);"
      >
        Login
      </a>
    </div>
  </div>
</div>

{% endblock %}
