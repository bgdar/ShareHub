{% extends "layouts.html" %} {% block content %}

<div
  class="min-h-screen bg-[var(--color-bg-main)] flex items-center justify-center px-4"
  x-data="{ successMessage: '', errorMessage: '' }"
>
  <div
    class="w-full max-w-2xl rounded-xl shadow-xl p-8 bg-[var(--color-bg-form)]"
  >
    <!-- Title -->
    <h2
      class="text-2xl font-semibold mb-6"
      style="color: var(--color-text-header)"
    >
      Update Profile
    </h2>

    <!-- Django messages -->
    {% if messages %} {% for message in messages %}
    <div
      class="mb-4 rounded-md px-4 py-3 text-sm text-white"
      style="
               background-color:
               {% if message.tags == 'error' %}
                 var(--color-error-soft)
               {% elif message.tags == 'success' %}
                 var(--color-success-soft)
               {% else %}
                 var(--color-info-soft)
               {% endif %}
             "
    >
      {{ message }}
    </div>
    {% endfor %} {% endif %}

    <!-- Update Form -->
    <form method="post" enctype="multipart/form-data" class="space-y-5">
      {% csrf_token %}

      <!-- Full Name -->
      <div>
        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          Full Name
        </label>
        {{ form.full_name }}
      </div>

      <!-- Username -->
      <div>
        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          Username
        </label>
        {{ form.username }}
      </div>

      <!-- Email -->
      <div>
        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          Email
        </label>
        {{ form.email }}
      </div>

      <!-- Avatar Upload -->
      <div>
        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          Avatar
        </label>
        {{ form.avatar }}
      </div>

      <!-- Optional: Change Password -->
      <div x-data="{ showPassword1: false, showPassword2: false }">
        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          New Password
        </label>
        <div class="relative mb-3">
          <input
            :type="showPassword1 ? 'text' : 'password'"
            name="password1"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />
          <button
            type="button"
            @click="showPassword1 = !showPassword1"
            class="absolute right-2 top-2 text-sm"
            style="color: var(--color-text-muted)"
          >
            👁
          </button>
        </div>

        <label
          class="block text-sm mb-1"
          style="color: var(--color-text-secondary)"
        >
          Confirm Password
        </label>
        <div class="relative">
          <input
            :type="showPassword2 ? 'text' : 'password'"
            name="password2"
            class="w-full rounded-md px-3 py-2 pr-10 border focus:outline-none focus:ring-2"
            style="
              background-color: var(--color-bg-main);
              border-color: var(--color-border-soft);
              color: var(--color-text-main);
              --tw-ring-color: var(--color-primary);
            "
          />
          <button
            type="button"
            @click="showPassword2 = !showPassword2"
            class="absolute right-2 top-2 text-sm"
            style="color: var(--color-text-muted)"
          >
            👁
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-2 rounded-md font-semibold text-white transition"
        style="background-color: var(--color-primary)"
        onmouseover="this.style.backgroundColor = 'var(--color-primary-hover)'"
        onmouseout="this.style.backgroundColor = 'var(--color-primary)'"
      >
        Update Profile
      </button>
    </form>
  </div>
</div>

{% endblock %}
