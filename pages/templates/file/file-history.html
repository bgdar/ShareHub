{% extends "layouts.html" %} {% block content %}
<div class="bg-[var(--color-bg-main)] min-h-screen font-sans text-[var(--color-text-main)]" x-data="fileHistory()" >
	<div class="container mx-auto p-6">
		<h1 class="text-3xl font-bold mb-4" style="color: var(--color-text-header)">
			History Upload Files
		</h1>

		<p class="mb-6 text-sm" style="color: var(--color-text-muted)">
			Daftar file yang sudah diupload oleh pengguna.
		</p>

		<!-- Table -->
		<div class="overflow-x-auto rounded-xl shadow-lg">
			<table class="min-w-full border border-[var(--color-border-light)] divide-y divide-[var(--color-border-light)]">
				<thead class="bg-[var(--color-bg-form)]">
					<tr>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							File Name
						</th>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							Category
						</th>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							Description
						</th>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							Size
						</th>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							Uploaded At
						</th>
						<th class="px-4 py-2 text-left text-sm font-medium" style="color: var(--color-text-header)">
							Action
						</th>
					</tr>
				</thead>
				<tbody class="bg-[var(--color-bg-main)] divide-y divide-[var(--color-border-light)]">
					<template x-for="file in files" :key="file.id">
						<tr class="hover:bg-[var(--color-bg-hover)] transition">
							<td class="px-4 py-2" x-text="file.fileName"></td>
							<td class="px-4 py-2">
								<span class="px-2 py-1 rounded-full text-xs font-semibold text-white" :class="getTagColor(file)">
									<span x-text="file.category"></span>
								</span>
							</td>
							<td class="px-4 py-2" x-text="file.description || '-'"></td>
							<td class="px-4 py-2" x-text="formatSize(file.file_size)"></td>
							<td class="px-4 py-2" x-text="formatDate(file.create_at)"></td>
							<td class="px-4 py-2">
								<a :href="file.download_url" target="_blank"
									class="text-[var(--color-primary)] hover:text-[var(--color-primary-hover)] font-semibold">
									Download
								</a>
							</td>
						</tr>
					</template>
				</tbody>
			</table>
		</div>

		<div class="mt-4 text-sm text-[var(--color-text-muted)]" x-show="files.length === 0">
			Tidak ada file yang diupload.
		</div>
	</div>

	<!-- ================= Alpine Logic ================= -->
	<script>
		function fileHistory() {
			return {
				files: [],

				init() {
					fetch("/api/file/list")
						.then((res) => res.json())
						.then((data) => {
							// Transform data supaya ada category & download_url
							this.files = data.map((file) => {
								let category = "";
								let download_url = "";
								cosole.log("file : ", file);

								if (file.code_file) {
									category = "code";
									download_url = file.code_file;
								} else if (file.document_file) {
									category = "document";
									download_url = file.document_file;
								} else if (file.arsip_file) {
									category = "arsip";
									download_url = file.arsip_file;
								} else if (file.executable_file) {
									category = "executable";
									download_url = file.executable_file;
								} else if (file.image_file) {
									category = "image";
									download_url = file.image_file;
								} else {
									category = "unknown";
									download_url = "#";
								}

								return {
									...file,
									category,
									download_url,
								};
							});
						});
				},

				formatSize(bytes) {
					const sizes = ["B", "KB", "MB", "GB"];
					if (bytes === 0) return "0 B";
					const i = Math.floor(Math.log(bytes) / Math.log(1024));
					return (bytes / Math.pow(1024, i)).toFixed(2) + " " + sizes[i];
				},

				formatDate(datetime) {
					const date = new Date(datetime);
					return date.toLocaleString();
				},

				getTagColor(file) {
					switch (file.category) {
						case "code":
							return "bg-[var(--color-info)]";
						case "document":
							return "bg-[var(--color-primary)]";
						case "arsip":
							return "bg-[var(--color-warning)]";
						case "executable":
							return "bg-[var(--color-error)]";
						case "image":
							return "bg-[var(--color-success)]";
						default:
							return "bg-[var(--color-text-muted)]";
					}
				},
			};
		}
	</script>
</div>
{% endblock %}
